# ansible/inventory.ini
# ─────────────────────────────────────────────────────────────────────────────
# Replace the IP / hostname and ansible_user with your real server values.
# The SSH key is passed in at runtime by the Jenkinsfile (--private-key flag).
# ─────────────────────────────────────────────────────────────────────────────

[web]
app_server ansible_host=YOUR_SERVER_IP ansible_user=ubuntu

[web:vars]
ansible_python_interpreter=/usr/bin/python3
