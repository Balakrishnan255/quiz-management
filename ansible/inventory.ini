# ansible/inventory.ini
# ─────────────────────────────────────────────────────────────────────────────
# Replace the IP / hostname and ansible_user with your real server values.
# The SSH key is passed in at runtime by the Jenkinsfile (--private-key flag).
# ─────────────────────────────────────────────────────────────────────────────

[web]
app_server ansible_host=172.198.162.99 ansible_user=azureuser

[web:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
